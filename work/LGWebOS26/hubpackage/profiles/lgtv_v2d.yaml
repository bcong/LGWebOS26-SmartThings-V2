name: lgtv.v2d
components:
    - id: main
      capabilities:
          - id: switch
            version: 1
          - id: mirrordouble43237.lgTvRemote
            version: 1
          - id: audioVolume
            version: 1
          - id: audioMute
            version: 1
          - id: partyvoice23922.lgvolumeup
            version: 1
          - id: partyvoice23922.lgvolumedown
            version: 1
          - id: partyvoice23922.lgmediainputsource
            version: 1
          - id: partyvoice23922.lgcurrentapp
            version: 1
          - id: mediaPresets
            version: 1
          - id: partyvoice23922.lgcurrentchannel
            version: 1
          - id: partyvoice23922.lgchannelnumber
            version: 1
          - id: tvChannel
            version: 1
          - id: partyvoice23922.lgmessage
            version: 1
          - id: partyvoice23922.status
            version: 1
          - id: mirrordouble43237.lgpowerstate
            version: 1
          - id: mirrordouble43237.lgscreenstate
