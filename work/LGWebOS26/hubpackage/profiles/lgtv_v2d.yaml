metadata:
    mnmn: SmartThingsCommunity
    vid: a16fe443-da47-3e65-bd7c-b0c4597753aa
    ocfDeviceType: oic.d.tv
preferences:
    - title: "Enable Remote Control"
      name: enableRemoteControl
      description: "Enables LG remote-button commands and the pointer input socket."
      required: true
      preferenceType: boolean
      definition:
          default: false
    - title: "Refresh Frequency"
      name: freq
      description: "Refresh data every n seconds"
      required: true
      preferenceType: integer
      definition:
          minimum: 10
          maximum: 86400
          default: 60
    - title: "Volume Change Interval"
      name: volbump
      description: "Volume Up/Down Change Amount"
      required: true
      preferenceType: integer
      definition:
          minimum: 1
          maximum: 20
          default: 5
    - title: "Keep WebSocket Active Screen Off"
      name: keepConnectionWhenOff
      description: "Turns off only the display and keeps webOS running; uses more power than standby."
      required: true
      preferenceType: boolean
      definition:
          default: true
    - title: "WOL MAC Address"
      name: macaddr
      description: "Device MAC Address"
      required: false
      preferenceType: string
      definition:
          stringType: text
          minLength: 17
          maxLength: 17
          default: "xx:xx:xx:xx:xx:xx"
    - title: "WOL Broadcast Address"
      name: bcastaddr
      description: "IP:port Address"
      required: false
      preferenceType: string
      definition:
          stringType: text
          minLength: 11
          maxLength: 17
          default: "255.255.255.255:7"
